<html>
<head>
  <style>
    body { background-color: #aaaaaa }
  </style>
</head>
<body>
  <list>
    <div id="div"> Hello </div>
    <button id="button"> Rename </button>
    <script>
      const div = document.getElementById("div")
      const button = document.getElementById("button")

      button.addEventListener("click", () => {
        const input = document.createElement("form")
        const text = document.createElement("input")

        if (div.querySelector("form")) { return }
        div.appendChild(input)
        input.appendChild(text)

        input.addEventListener("submit", (event) => {
          event.preventDefault()
          div.textContent = text.value
          input.remove()
        });
      });
    </script>
  </list>
  <list>
    <input type="range" min="0" max="255" value="0">
    <input type="range" min="0" max="255" value="0">
    <input type="range" min="0" max="255" value="0">
  </list>
</body>
<script>
  const div = document.getElementById("div")
  const sliders = document.querySelectorAll('input[type="range"]')

  HTMLElement.prototype.changeColor = function changeColor(r, g, b) {
      this.style.color = `rgb(${r}, ${g}, ${b})`
  }
  sliders.forEach(slider => {
    slider.addEventListener("input", () => {
      div.changeColor(sliders[0].value, sliders[1].value, sliders[2].value)
    });
  });
</script>
</html>
