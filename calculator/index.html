<html>
  <head>
    <title>Friendly-goggles calculator</title>
    <style>
      .smallfirst {
          font-size: 22px;
          color: #aaa;
      }
      .big {
        color: #fff;
        font-size: 32px;
      }
      .size {
        color: #000;
        font-size: 16px;
        border: 4px solid rgb(100, 100, 100);
        border-radius: 8px;
        background-color: rgb(200, 200, 200);
      }
      
      .sizeForS {
          color: #fff;
          font-size: 16px;
          border: 4px solid rgb(128, 50, 64);
          border-radius: 8px;
          background-color: rgb(255, 100, 128);
      }
    </style>
  </head>
  <body style="background-color: #000;">
    <div class="smallfirst" id="typed"></div>
    <div class="big" id="result"></div>
    <group id="group0">
        <button class="size">+</button>
        <button class="size">-</button>
        <button class="size">*</button>
        <button class="size">/</button>
        <button class="size">**</button>
    </group>
    <br><br>
    <group id="group1">
        <button class="size">1</button>
        <button class="size">2</button>
        <button class="size">3</button>
        
        <br>
        
        <button class="size">4</button>
        <button class="size">5</button>
        <button class="size">6</button>
        
        <br>
        
        <button class="size">7</button>
        <button class="size">8</button>
        <button class="size">9</button>
        
        <br>
        
        <button class="size" style="padding: 0px 40px;">0</button>
    </group>
    <br><br>
    <button id="backspace" class="size">⌫</button>
    <button class="sizeForS" id="clear">S</button>
    <script>
        const typed = document.getElementById("typed");
        const result = document.getElementById("result");
        const all0 = document.getElementById("group0").children;
        const all1 =  document.getElementById("group1").children;
        const backspace = document.getElementById("backspace");
        const clear = document.getElementById("clear");
        
        for (const child of all0) {
            child.onclick = (event) => { typed.textContent += child.textContent };
        };
        for (const child of all1) {
            child.onclick = (event) => { typed.textContent += child.textContent };
        };
        backspace.onclick = (event) => {
            typed.textContent = typed.textContent.slice(0, -1);
        };
        
        setInterval(function() {
            result.textContent = eval(typed.textContent);
        }, 0);
        
        clear.onclick = (event) => {
            typed.textContent = "";
        };
    </script>
  </body>
</html>
