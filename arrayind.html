<html>

<head>
  <title> Type for ARRAY </title>
  <style>
    body { background-color: #ffffff }
  </style>
</head>

<classes>
  <style>
    .mono {
      font-family: monospace;
      background-color: rgba(100, 100, 100, 30%);
    }
  </style>
</classes>

<body>
  <form id="form">
    <input type="text" id="input">
    <button type="submit"> Add to list </button>
  </form>
  <button id="clearall"> Delete all </button>
  <button id="clearall2"> Delete all permanently </button>
  <button id="restoreall"> Restore all deleted </button>
  <input id="fileupload" type="file" accept=".txt">
  <br>
  <list>
    <input id="check" type="checkbox">
    Put dots at end of sentence
  </list>
  <list>
    <input id="check2" type="checkbox">
    Treat sentence as a code block
  </list>
  <br>
  <script>
    const input = document.getElementById("input");
    const form = document.getElementById("form");
    const check = document.getElementById("check");
    const check2 = document.getElementById("check2");
    let readytorestore = [];
    const restoreall = document.getElementById("restoreall");
    const upload = document.getElementById("fileupload");
    
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (input.value === "") { return };
      const text = document.createElement("div");
      const button = document.createElement("button");
      const button2 = document.createElement("button");
      let result = input.value
      
      if (check.checked) {
        result += "."
      }
      if (check2.checked) {
        text.setAttribute("class", "mono")
      }
      text.textContent = result
      text.id = "text";
      document.body.appendChild(text);
      input.value = "";
      button.textContent = "Delete ";
      text.appendChild(button);
      button.addEventListener("click", () => {
        readytorestore.push(text.firstChild.textContent);
        text.remove();
      });
      button2.textContent = "Delete permanently ";
      text.appendChild(button2);
      button2.addEventListener("click", () => {
        text.remove();
      });
    });
    restoreall.addEventListener("click", () => {
      for (const child of readytorestore) {
        const text = document.createElement("div");
        const button = document.createElement("button");
        const button2 = document.createElement("button");
        let result = child;
        
        
        if (check2.checked) {
          text.setAttribute("class", "mono");
        };
        text.textContent = result;
        text.id = "text";
        document.body.appendChild(text);
        button.textContent = "Delete ";
        text.appendChild(button);
        button.addEventListener("click", () => {
          readytorestore.push(text.firstChild.textContent);
          text.remove();
        });
        button2.textContent = "Delete permanently ";
        text.appendChild(button2);
        button2.addEventListener("click", () => {
          text.remove();
        });
      };
      readytorestore = [];
    });
    upload.addEventListener("change", async () => {
      const file = upload.files[0]
      if (!file || file.size === 0) { return };
      const input2 = await file.text();
      const text = document.createElement("div");
      const button = document.createElement("button");
      const button2 = document.createElement("button");
      let result = input2;
      
      if (check.checked) {
        result += ".";
      };
      if (check2.checked) {
        text.setAttribute("class", "mono");
      };
      text.textContent = result;
      text.id = "text";
      document.body.appendChild(text);
      button.textContent = "Delete ";
      text.appendChild(button);
      button.addEventListener("click", () => {
        readytorestore.push(text.firstChild.textContent);
        text.remove();
      });
      button2.textContent = "Delete permanently "
      text.appendChild(button2)
      button2.addEventListener("click", () => {
        text.remove();
      });
    });   
  </script>
  <script>
    const button = document.getElementById("clearall");
    const button2 = document.getElementById("clearall2");
    
    button.addEventListener("click", () => {
      for (const child of document.querySelectorAll("#text")) {
        readytorestore.push(child.firstChild.textContent);
        child.remove();
      };
    });
    button2.addEventListener("click", () => {
      for (const child of document.querySelectorAll("#text")) {
        child.remove();
      };
    });
  </script>
</body>

</html>
