<html lang="en">
  <head>
    <title>Zipup</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <style>
      :root {
        --required: #ff105a;
      }
      body {
        background-color: #1e1e1e;
        color: #fff;
      }
      input[type=file] {
        color: transparent;
      }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <h1>Start with a name <span style="color:var(--required);">*</span></h1>
    <input type="text" id="q" placeholder="My awesome project">
    <h1>Setup your files</h1>
    <input type="text" id="w" placeholder='{"README.md": "Hello, World!"}'>
    <h1>Setup your folders too</h1>
    <input type="text" id="e" placeholder='[".github", "important"]'>
    <hr>
    <button id="q0">Generate (download zip)</button>
    <button id="w0">Generate (new preset)</button>
  </body>
  <script>
    const name = document.getElementById("q");
    const gen = document.getElementById("q0");
    const prs = document.getElementById("w0");
    const files = document.getElementById("w");
    const folders = document.getElementById("e");
    
    const setup = async () => {
      const zip = new JSZip();
      if (name.value === '' || name.value.length < 3) return;
      
      const json = JSON.parse(files.value);
      for (const [name, contents] of Object.entries(json)) {
        zip.file(name, contents);
      }
      const a = document.createElement("a");
      const json2 = JSON.parse(folders.value);
      for (const name of json2) {
        zip.folder(name);
      }
      
      const zipQ = await zip.generateAsync({'type': 'blob'}).then((q) => URL.createObjectURL(q));
      a.href = zipQ;
      a.download = name.value.endsWith(".zip") ? name.value : name.value + ".zip";
      a.click();
    }
    prs.onclick = () => {
      name.value = "Empty web project"
      files.value = '{"index.html": "<!DOCTYPE HTML>\\n<html>\\n  <head></head>\\n  <body></body>\\n</html>", "themes.css": "", "script.js": ""}'
    }
    gen.onclick = () => setup();
  </script>
</html>
