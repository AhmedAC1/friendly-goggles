<!DOCTYPE html>
<html>
  <head>
    <title>Color converter</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One">
    <style>
      .ok {
        background-color: #0000AA;
        color: #fff;
        width: 100%;
        height: 40px;
        display: block;
        font-size: 40px;
        padding: 0.5px;
        font-family: "Black Ops One", sans-serif;
      }
      body {
        background-color: #f9f9f9;
      }
      h1 {
        font-family: "Black Ops One", sans-serif;
      }
      input, div {
        font-family: sans-serif;
      }
      .small {
        font-family: "Black Ops One", sans-serif;
        font-size: small;
      }
    </style>
  </head>
  <body>
    <span class="ok">Color converter</span>
    <h1>RGB to Hex</h1>
    <input type="text" value="(10, 34, 12)" id="input.rgb">
    <button id="clear.rgb">Clear</button>
    <div id="output.hex">#0A220C</div>
    <h1>Hex to RGB</h1>
    <input type="text" value="#FF3426" id="input.hex">
    <button id="clear.hex">Clear</button>
    <div id="output.rgb">(255, 52, 38)</div>
    
    <hr>
    
    <div class="small">To see the converted result, unfocus out of the box.</div>
    <script>
      const rgb = {
        rgb: document.getElementById("input.rgb"),
        hex: document.getElementById("output.hex")
      };
      const clear = {
        rgb: document.getElementById("clear.rgb"),
        hex: document.getElementById("clear.hex")
      };
      rgb.rgb.onblur = (item) => {
        rgb.hex.textContent = "#";
        const hexes = item.target.value.replace(/[()]/g, "").split(",").map(n => parseInt(n.trim()));
        for (const num of hexes) {
          if (isNaN(num)) continue;
          let hexCode = num.toString(16).toUpperCase();
          if (hexCode.length < 2) hexCode = 0 + hexCode;
          rgb.hex.textContent += hexCode;
        }
      }
      const hex = {
        hex: document.getElementById("input.hex"),
        rgb: document.getElementById("output.rgb")
      };
      hex.hex.onblur = (item) => {
        hex.rgb.textContent = "";
        let rT = "";
        for (const char of item.target.value.replace("#", "").match(/.{1,2}/g)) {
          let dec = parseInt(char, 16);
          if (!isNaN(dec)) {
            rT += dec + ", ";
          }
        }
        hex.rgb.textContent = "(" + rT.slice(0, -2) + ")";
      }
      clear.rgb.onclick = () => {
        rgb.rgb.value = "";
        rgb.hex.textContent = "";
      }
      clear.hex.onclick = () => {
        hex.hex.value = "";
        hex.rgb.textContent = "";
      }
    </script>
  </body>
</html>
